name: Deploy a Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Si haces varios pushes seguidos, cancelamos el despliegue anterior.
concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      # Publica dist/app/browser en el Worker weathered-wave-4148
      # (el que tiene el dominio tantraparaparejas.com).
      - name: Desplegar en Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
